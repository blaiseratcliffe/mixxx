# Raspberry Pi 5 + Waveshare 9-DSI-TOUCH-B
# Effective desktop: 1280x720 landscape

# Start Mixxx on its dedicated workspace using XWayland.
exec swaymsg 'workspace "1:Mixxx"; exec env QT_QPA_PLATFORM=xcb /home/pi/src/mixxx-cdj/build/mixxx --resource-path /usr/share/mixxx'

# XWayland Mixxx window rules.
for_window [class="Mixxx" instance="mixxx"] focus_on_window_activation smart
for_window [class="Mixxx" instance="mixxx"] fullscreen enable

# Waveshare panel is natively 720x1280 portrait.
# Rotate to landscape.
output DSI-2 transform 270 scale 1

# Map Goodix touchscreen to the DSI panel.
# Do NOT apply a calibration matrix. Sway handles rotation.
input type:touch map_to_output DSI-2
